<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de valores</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Manrope",sans-serif;
}

body{
background:#F7F4EC;
color:#171717;
padding:34px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
margin-bottom:30px;
}

.header h1{
font-size:36px;
font-weight:800;
color:#111111;
margin-bottom:8px;
}

.header p{
font-size:15px;
color:#555555;
}

.card{
background:white;
border-radius:26px;
padding:26px;
margin-bottom:22px;
border:1px solid #E7E2DA;
box-shadow:0 8px 26px rgba(0,0,0,.05);
}

label{
display:block;
font-size:13px;
font-weight:700;
color:#111111;
margin-top:18px;
margin-bottom:8px;
}

select,input{
width:100%;
padding:15px;
border-radius:14px;
border:1px solid #D7D1C8;
font-size:15px;
background:white;
color:#222;
transition:.2s;
}

select:focus,
input:focus{
outline:none;
border-color:#9F49A4;
box-shadow:0 0 0 3px rgba(159,73,164,.15);
}

button{
cursor:pointer;
border:none;
border-radius:14px;
padding:15px;
font-size:15px;
font-weight:700;
transition:.2s;
}

.primary{
width:100%;
background:#9F49A4;
color:white;
margin-top:24px;
}

.primary:hover{
background:#883A8D;
}

.secondary{
flex:1;
background:white;
border:1px solid #9F49A4;
color:#9F49A4;
}

.secondary:hover{
background:#F7ECF8;
}

.card h3{
font-size:20px;
font-weight:700;
color:#111111;
margin-bottom:14px;
}

.item{
display:flex;
justify-content:space-between;
align-items:flex-start;
padding:16px 0;
border-bottom:1px solid #EEE8DF;
}

.item:last-child{
border-bottom:none;
}

.item-info strong{
display:block;
font-size:15px;
color:#111111;
}

.item-info small{
display:block;
margin-top:4px;
color:#666666;
font-size:13px;
}

.item strong:last-child{
color:#111111;
}

.resume{
margin-top:18px;
padding-top:18px;
border-top:1px solid #E7E2DA;
}

.resume-line{
display:flex;
justify-content:space-between;
padding:7px 0;
font-size:15px;
color:#222222;
}

.resume-line strong{
color:#111111;
}

.totalBox{
background:#9F49A4;
color:white;
border-radius:22px;
padding:28px;
text-align:center;
margin-top:20px;
}

.totalBox small{
display:block;
font-size:12px;
letter-spacing:.8px;
opacity:.9;
margin-bottom:8px;
}

.totalBox h2{
font-size:42px;
font-weight:800;
}

.empty{
text-align:center;
color:#888888;
padding:24px;
}

.footer-actions{
display:flex;
gap:12px;
margin-top:22px;
}

@media(max-width:640px){

body{
padding:18px;
}

.header h1{
font-size:30px;
}

.totalBox h2{
font-size:34px;
}

.footer-actions{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Calculadora de valores</h1>

<p>Producción y edición de contenido</p>

</div>

<div class="card">

<label>Trabajo</label>

<select id="trabajo">

<option value="" selected disabled>Seleccionar trabajo a realizar</option>

<option>Reel</option>
<option>Carrusel</option>
<option>Historias (3-5)</option>

</select>

<label>Tipo de servicio</label>

<select id="tipo">

<option value="" selected disabled>Elegir tipo de servicio</option>

<option>Edición solo</option>
<option>Producción + Grabación + Edición</option>
<option>Idea + Guión + Producción + Grabación + Edición</option>

</select>

<label>Cantidad</label>

<input id="cantidad" type="number" min="1" max="10" value="1">

<button class="primary" id="agregar">
Agregar al presupuesto
</button>

</div>

<div class="card">

<h3>Resumen del proyecto</h3>

<div id="lista">

<div class="empty">
Todavía no agregaste trabajos.
</div>

</div>

<div class="resume">

<div class="resume-line">
<span>Reels</span>
<strong id="reels">$0</strong>
</div>

<div class="resume-line">
<span>Carruseles</span>
<strong id="carruseles">$0</strong>
</div>

<div class="resume-line">
<span>Historias</span>
<strong id="historias">$0</strong>
</div>

</div>

<div class="totalBox">

<small>TOTAL DEL PROYECTO</small>

<h2 id="total">$0</h2>

</div>

<div class="footer-actions">

<button class="secondary" id="copiar">
Copiar presupuesto
</button>

<button class="secondary" id="pdf">
Descargar PDF
</button>

<button class="secondary" id="reiniciar">
Reiniciar
</button>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const tarifas={

"Reel":{
"Edición solo":18000,
"Producción + Grabación + Edición":35000,
"Idea + Guión + Producción + Grabación + Edición":50000
},

"Carrusel":{
"Edición solo":15000,
"Producción + Grabación + Edición":25000,
"Idea + Guión + Producción + Grabación + Edición":35000
},

"Historias (3-5)":{
"Edición solo":10000,
"Producción + Grabación + Edición":20000,
"Idea + Guión + Producción + Grabación + Edición":30000
}

};

const descuentos={
1:1,
2:.98,
3:.96,
4:.94,
5:.92,
6:.90,
7:.88,
8:.87,
9:.86,
10:.85
};

const items=[];

const dinero=n=>new Intl.NumberFormat("es-AR",{
style:"currency",
currency:"ARS",
maximumFractionDigits:0
}).format(Math.round(n));

function render(){

const lista=document.getElementById("lista");

let total=0;
let reels=0;
let carruseles=0;
let historias=0;

if(items.length===0){

lista.innerHTML='<div class="empty">Todavía no agregaste trabajos.</div>';

document.getElementById("total").textContent=dinero(0);
document.getElementById("reels").textContent=dinero(0);
document.getElementById("carruseles").textContent=dinero(0);
document.getElementById("historias").textContent=dinero(0);

return;

}

lista.innerHTML=items.map(item=>{

total+=item.total;

if(item.trabajo==="Reel") reels+=item.total;
if(item.trabajo==="Carrusel") carruseles+=item.total;
if(item.trabajo==="Historias (3-5)") historias+=item.total;

return`
<div class="item">
<div class="item-info">
<strong>${item.cantidad} ${item.trabajo}</strong>
<small>${item.tipo}</small>
</div>
<strong>${dinero(item.total)}</strong>
</div>`;

}).join("");

document.getElementById("total").textContent=dinero(total);
document.getElementById("reels").textContent=dinero(reels);
document.getElementById("carruseles").textContent=dinero(carruseles);
document.getElementById("historias").textContent=dinero(historias);

}

document.getElementById("agregar").onclick=()=>{

const trabajo=document.getElementById("trabajo").value;
const tipo=document.getElementById("tipo").value;

if(!trabajo || !tipo){
alert("Completá el trabajo y el tipo de servicio.");
return;
}

let cantidad=parseInt(document.getElementById("cantidad").value);

if(cantidad<1)cantidad=1;
if(cantidad>10)cantidad=10;

const unitario=tarifas[trabajo][tipo];
const total=unitario*cantidad*descuentos[cantidad];

items.push({
trabajo,
tipo,
cantidad,
total
});

document.getElementById("trabajo").selectedIndex=0;
document.getElementById("tipo").selectedIndex=0;
document.getElementById("cantidad").value=1;

render();

};

document.getElementById("reiniciar").onclick=()=>{

items.length=0;
render();

};

document.getElementById("copiar").onclick=()=>{

if(items.length===0)return;

let suma=0;

const texto=items.map(item=>{
suma+=item.total;
return`${item.cantidad} ${item.trabajo} — ${item.tipo}: ${dinero(item.total)}`;
}).join("\n")+`\n\nTOTAL DEL PROYECTO: ${dinero(suma)}`;

navigator.clipboard.writeText(texto);

};

document.getElementById("pdf").onclick=()=>{

if(items.length===0)return;

const { jsPDF }=window.jspdf;

const doc=new jsPDF();

const hoy=new Date();

const fecha=hoy.toLocaleDateString("es-AR",{
day:"2-digit",
month:"long",
year:"numeric"
});

let y=24;

doc.setFont("helvetica","bold");
doc.setFontSize(20);
doc.setTextColor(159,73,164);

doc.text("Merlina Aguel",20,y);

y+=8;

doc.setFont("helvetica","normal");
doc.setFontSize(12);
doc.setTextColor(40);

doc.text("Producción y Edición de Contenido",20,y);

y+=10;

doc.setFontSize(10);
doc.setTextColor(120);

doc.text(`Fecha de emisión: ${fecha}`,20,y);

y+=14;

doc.setDrawColor(225);
doc.line(20,y,190,y);

y+=12;

let total=0;

items.forEach(item=>{

doc.setFont("helvetica","bold");
doc.setFontSize(12);
doc.setTextColor(30);

doc.text(`${item.cantidad} ${item.trabajo}`,20,y);

y+=7;

doc.setFont("helvetica","normal");
doc.setFontSize(11);

doc.text(item.tipo,20,y);

doc.text(dinero(item.total),190,y,{align:"right"});

y+=12;

total+=item.total;

if(y>250){

doc.addPage();
y=24;

}

});

doc.setDrawColor(225);
doc.line(20,y,190,y);

y+=14;

doc.setFont("helvetica","bold");
doc.setFontSize(18);
doc.setTextColor(159,73,164);

doc.text("Total del proyecto",20,y);

doc.text(dinero(total),190,y,{align:"right"});

y+=22;

doc.setFont("helvetica","normal");
doc.setFontSize(10);
doc.setTextColor(120);

doc.text(
"Este presupuesto es orientativo y puede ajustarse según el alcance del proyecto.",
20,
y,
{maxWidth:170}
);

doc.save("Presupuesto-Merlina-Aguel.pdf");

};

render();

</script>

</body>
</html>
