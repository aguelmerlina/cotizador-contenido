
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador de Contenido</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Manrope",sans-serif;
}

body{
background:#F7F4EC;
color:#2F2F2F;
padding:32px;
}

.container{
max-width:680px;
margin:auto;
}

.header{
margin-bottom:28px;
}

.header h1{
color:#9F49A4;
font-size:34px;
margin-bottom:6px;
}

.header p{
color:#6E6E6E;
}

.card{
background:white;
border-radius:24px;
padding:24px;
margin-bottom:20px;
box-shadow:0 8px 24px rgba(0,0,0,.05);
border:1px solid #E8E2D8;
}

label{
display:block;
font-size:13px;
font-weight:700;
color:#9F49A4;
margin-bottom:8px;
margin-top:14px;
}

select,input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #D8D2C7;
font-size:15px;
background:white;
transition:.2s;
}

select:focus,input:focus{
outline:none;
border-color:#9F49A4;
box-shadow:0 0 0 3px rgba(159,73,164,.15);
}

button{
padding:15px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:15px;
font-weight:700;
transition:.2s;
}

.primary{
width:100%;
background:#9F49A4;
color:white;
margin-top:22px;
}

.primary:hover{
background:#883A8D;
}

.secondary{
flex:1;
background:white;
border:1px solid #9F49A4;
color:#9F49A4;
}

.secondary:hover{
background:#F7ECF8;
}

.item{
display:flex;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid #EEE8DF;
}

.item:last-child{
border-bottom:none;
}

.item-info small{
display:block;
color:#777;
margin-top:4px;
}

.resume{
margin-top:18px;
border-top:1px solid #E5DFD6;
padding-top:16px;
}

.resume-line{
display:flex;
justify-content:space-between;
padding:6px 0;
}

.totalBox{
background:#9F49A4;
color:white;
border-radius:22px;
padding:26px;
text-align:center;
margin-top:18px;
}

.totalBox small{
display:block;
opacity:.85;
letter-spacing:.5px;
margin-bottom:6px;
}

.totalBox h2{
font-size:40px;
}

.empty{
text-align:center;
color:#8B8B8B;
padding:20px;
}

.footer-actions{
display:flex;
gap:10px;
margin-top:20px;
}

@media(max-width:640px){

body{
padding:18px;
}

.header h1{
font-size:28px;
}

.totalBox h2{
font-size:32px;
}

.footer-actions{
flex-direction:column;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>Calculadora de Honorarios</h1>
<p>Producción y edición de contenido</p>
</div>

<div class="card">

<label>Trabajo</label>

<select id="trabajo">
<option>Reel</option>
<option>Carrusel</option>
<option>Historias (3-5)</option>
</select>

<label>Tipo de servicio</label>

<select id="tipo">
<option>Edición solo</option>
<option>Producción + Grabación + Edición</option>
<option>Idea + Guión + Producción + Grabación + Edición</option>
</select>

<label>Cantidad</label>

<input id="cantidad" type="number" min="1" max="10" value="1">

<button class="primary" id="agregar">
Agregar al presupuesto
</button>

</div>

<div class="card">

<h3 style="color:#9F49A4;margin-bottom:12px;">
Resumen del proyecto
</h3>

<div id="lista">

<div class="empty">
Todavía no agregaste trabajos.
</div>

</div>

<div class="resume">

<div class="resume-line">
<span>Reels</span>
<strong id="reels">$0</strong>
</div>

<div class="resume-line">
<span>Carruseles</span>
<strong id="carruseles">$0</strong>
</div>

<div class="resume-line">
<span>Historias</span>
<strong id="historias">$0</strong>
</div>

</div>

<div class="totalBox">

<small>TOTAL DEL PROYECTO</small>

<h2 id="total">$0</h2>

</div>

<div class="footer-actions">

<button class="secondary" id="copiar">
Copiar presupuesto
</button>

<button class="secondary" id="pdf">
Descargar PDF
</button>

<button class="secondary" id="reiniciar">
Reiniciar
</button>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const tarifas={

"Reel":{
"Edición solo":18000,
"Producción + Grabación + Edición":35000,
"Idea + Guión + Producción + Grabación + Edición":50000
},

"Carrusel":{
"Edición solo":15000,
"Producción + Grabación + Edición":25000,
"Idea + Guión + Producción + Grabación + Edición":35000
},

"Historias (3-5)":{
"Edición solo":10000,
"Producción + Grabación + Edición":20000,
"Idea + Guión + Producción + Grabación + Edición":30000
}

};

const descuentos={
1:1,
2:.98,
3:.96,
4:.94,
5:.92,
6:.90,
7:.88,
8:.87,
9:.86,
10:.85
};

const items=[];

const dinero=n=>new Intl.NumberFormat("es-AR",{
style:"currency",
currency:"ARS",
maximumFractionDigits:0
}).format(Math.round(n));

function render(){

const lista=document.getElementById("lista");

let total=0;
let reels=0;
let carruseles=0;
let historias=0;

if(items.length===0){

lista.innerHTML='<div class="empty">Todavía no agregaste trabajos.</div>';

document.getElementById("total").textContent=dinero(0);
document.getElementById("reels").textContent=dinero(0);
document.getElementById("carruseles").textContent=dinero(0);
document.getElementById("historias").textContent=dinero(0);

return;

}

lista.innerHTML=items.map(i=>{

total+=i.total;

if(i.trabajo==="Reel") reels+=i.total;
if(i.trabajo==="Carrusel") carruseles+=i.total;
if(i.trabajo==="Historias (3-5)") historias+=i.total;

return`
<div class="item">
<div class="item-info">
<strong>${i.cantidad} ${i.trabajo}</strong>
<small>${i.tipo}</small>
</div>
<strong>${dinero(i.total)}</strong>
</div>`;

}).join("");

document.getElementById("total").textContent=dinero(total);
document.getElementById("reels").textContent=dinero(reels);
document.getElementById("carruseles").textContent=dinero(carruseles);
document.getElementById("historias").textContent=dinero(historias);

}

document.getElementById("agregar").onclick=()=>{

const trabajo=document.getElementById("trabajo").value;
const tipo=document.getElementById("tipo").value;

let cantidad=parseInt(document.getElementById("cantidad").value);

if(cantidad<1)cantidad=1;
if(cantidad>10)cantidad=10;

const unitario=tarifas[trabajo][tipo];
const total=unitario*cantidad*descuentos[cantidad];

items.push({
trabajo,
tipo,
cantidad,
total
});

render();

};

document.getElementById("reiniciar").onclick=()=>{

items.length=0;
render();

};

document.getElementById("copiar").onclick=()=>{

if(items.length===0)return;

let suma=0;

const texto=items.map(i=>{
suma+=i.total;
return`${i.cantidad} ${i.trabajo} — ${i.tipo}: ${dinero(i.total)}`;
}).join("\n")+`\n\nTOTAL DEL PROYECTO: ${dinero(suma)}`;

navigator.clipboard.writeText(texto);

};

document.getElementById("pdf").onclick=()=>{

if(items.length===0)return;

const { jsPDF }=window.jspdf;

const doc=new jsPDF();

const hoy=new Date();

const fecha=hoy.toLocaleDateString("es-AR",{
day:"2-digit",
month:"long",
year:"numeric"
});

let y=24;

doc.setFont("helvetica","bold");
doc.setFontSize(20);
doc.setTextColor(159,73,164);

doc.text("Merlina Aguel",20,y);

y+=8;

doc.setFont("helvetica","normal");
doc.setFontSize(12);

doc.text("Producción y Edición de Contenido",20,y);

y+=10;

doc.setTextColor(120);

doc.text(`Fecha de emisión: ${fecha}`,20,y);

y+=14;

doc.setDrawColor(225);
doc.line(20,y,190,y);

y+=12;

let total=0;

items.forEach(item=>{

doc.setFont("helvetica","bold");
doc.setFontSize(12);
doc.setTextColor(40);

doc.text(`${item.cantidad} ${item.trabajo}`,20,y);

y+=7;

doc.setFont("helvetica","normal");
doc.setFontSize(11);

doc.text(item.tipo,20,y);

doc.text(dinero(item.total),190,y,{align:"right"});

y+=12;

total+=item.total;

if(y>250){

doc.addPage();
y=24;

}

});

doc.setDrawColor(225);
doc.line(20,y,190,y);

y+=14;

doc.setFont("helvetica","bold");
doc.setFontSize(18);
doc.setTextColor(159,73,164);

doc.text(`Total del proyecto`,20,y);

doc.text(dinero(total),190,y,{align:"right"});

y+=22;

doc.setFont("helvetica","normal");
doc.setFontSize(10);
doc.setTextColor(120);

doc.text("Este presupuesto es orientativo y puede ajustarse según el alcance del proyecto.",20,y,{maxWidth:170});

doc.save("Presupuesto-Merlina-Aguel.pdf");

};

render();

</script>

</body>
</html>
